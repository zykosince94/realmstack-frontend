services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-realmstack}
      POSTGRES_USER: ${POSTGRES_USER:-realmstack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - realmstack-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../realmstack-backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-realmstack}:${POSTGRES_PASSWORD:-local-dev-only}@postgres:5432/${POSTGRES_DB:-realmstack}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-local-only-change-this-secret-before-deploying}
      APP_ENV: local
      DEMO_MODE: ${DEMO_MODE:-true}
      # Optional AI assistant: set AI_ENCRYPTION_KEY in .env to enable it (see .env.example).
      AI_ENCRYPTION_KEY: ${AI_ENCRYPTION_KEY:-}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
    environment:
      VITE_API_PROXY_TARGET: http://api:8080
    ports:
      - "${WEB_PORT:-5174}:5173"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  realmstack-postgres:
