# RealmStack API contract (OpenAPI 3).
# Copied from realmstack-backend/api/openapi.yaml by `npm run sync:openapi`.
# The backend contract is authoritative; do not edit this copy.
# RealmStack API contract (OpenAPI 3.0). Hand-maintained: update it with every route change.
# TestOpenAPICoversEveryRoute fails when routes and this file disagree; the frontend
# generates src/api/generated/schema.ts from it (npm run generate:api).
openapi: "3.0.3"
info:
  title: "RealmStack API"
  version: "1.0.0"
  description: "Multi-tenant game backend. Every response uses {data, meta}; every error uses {error:{code,message,details}, meta}. Mutations require an Idempotency-Key: a replay returns the stored result and status, a different request with the same key returns 409. This document is the API contract: the frontend generates its client from it, and a backend test fails if a route is missing here."
servers:
  - url: "http://localhost:8080"
tags:
  - name: platform
  - name: dashboard
  - name: projects
  - name: configuration
  - name: players
  - name: players-admin
    description: "Dashboard player management: read an owned environment's players and act on them (grants, currency, XP, stats, claims, quests, scores, saves), and ban or unban them."
  - name: inventory
  - name: economy
  - name: progression
  - name: leaderboards
  - name: stats
  - name: achievements
  - name: quests
  - name: saves
    description: "Cloud saves: named JSON slots per player with optimistic versioning."
  - name: ai
paths:
  "/healthz":
    get:
      operationId: getHealthz
      tags:
        - platform
      summary: "Liveness check."
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/Health"
                  meta:
                    "$ref": "#/components/schemas/Meta"
                required:
                  - data
                  - meta
  "/v1/auth/register":
    post:
      operationId: postAuthRegister
      tags:
        - dashboard
      summary: "Create a dashboard user (rate limited)."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/Credentials"
      responses:
        "201":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/UserSession"
                  meta:
                    "$ref": "#/components/schemas/Meta"
                required:
                  - data
                  - meta
        "400":
          "$ref": "#/components/responses/E400"
        "409":
          "$ref": "#/components/responses/E409"
        "422":
          "$ref": "#/components/responses/E422"
        "429":
          "$ref": "#/components/responses/E429"
  "/v1/auth/login":
    post:
      operationId: postAuthLogin
      tags:
        - dashboard
      summary: "Sign in a dashboard user (rate limited). Also sets the httpOnly rs_dashboard_refresh cookie (path /v1/auth, SameSite=Strict) used by POST /v1/auth/refresh."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/Credentials"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/UserSession"
                  meta:
                    "$ref": "#/components/schemas/Meta"
                required:
                  - data
                  - meta
        "400":
          "$ref": "#/components/responses/E400"
        "401":
          "$ref": "#/components/responses/E401"
        "422":
          "$ref": "#/components/responses/E422"
        "429":
          "$ref": "#/components/responses/E429"
  "/v1/auth/refresh":
    post:
      operationId: postAuthRefresh
      tags:
        - dashboard
      summary: "Resume or extend a dashboard session. Reads the httpOnly rs_dashboard_refresh cookie set by login, rotates it, and returns a new access token. Reusing a rotated cookie revokes the whole sign-in (401 SESSION_REUSE). 401 NO_SESSION or INVALID_SESSION means sign in again (rate limited)."
      security: []
      responses:
        "200":
          description: Success; a new refresh cookie is set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/UserSession"
                  meta:
                    "$ref": "#/components/schemas/Meta"
                required:
                  - data
                  - meta
        "401":
          "$ref": "#/components/responses/E401"
        "429":
          "$ref": "#/components/responses/E429"
  "/v1/auth/logout":
    post:
      operationId: postAuthLogout
      tags:
        - dashboard
      summary: "End the dashboard session: revokes the refresh cookie's sign-in and clears the cookie. Succeeds without a cookie."
      security: []
      responses:
        "200":
          description: Signed out.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      signed_out:
                        type: boolean
                    required:
                      - signed_out
                  meta:
