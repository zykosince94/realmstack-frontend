      security:
        - serverCredential: []
      parameters:
        - name: playerId
          in: path
          required: true
          description: "Player ID (must belong to the credential's environment)."
          schema:
            type: string
            format: uuid
        - name: slot
          in: path
          required: true
          description: "Save slot name: 1 to 63 lowercase letters, digits, - or _."
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9_-]{0,62}$"
        - "$ref": "#/components/parameters/IdempotencyKey"
