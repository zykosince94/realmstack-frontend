  "/v1/server/batch":
    post:
      operationId: postServerBatch
      tags:
        - economy
      summary: "Apply many trusted writes in one request (grant, credit, xp, stat, flag) across players in the credential's environment. Each entry has its own idempotency_key and runs in its own savepoint: a failing entry is reported and does not roll back the others; entries apply in request order. The response is 200 with a result per entry. 422 BATCH_SIZE above the project's max_batch_entries (default 500); 429 QUOTA_EXCEEDED counts every entry as a write."
      security:
        - serverCredential: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/BatchRequest"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/BatchResult"
                  meta:
                    "$ref": "#/components/schemas/Meta"
                required:
                  - data
                  - meta
        "400":
          "$ref": "#/components/responses/E400"
        "401":
          "$ref": "#/components/responses/E401"
        "422":
          "$ref": "#/components/responses/E422"
        "429":
          "$ref": "#/components/responses/E429"
components:
  securitySchemes:
    userBearer:
      type: http
      scheme: bearer
      description: "Dashboard user access token."
    playerBearer:
      type: http
      scheme: bearer
      description: "Player access token. A banned player's token is refused on every route with 403 PLAYER_BANNED (details: reason, expires_at)."
    serverCredential:
      type: apiKey
      in: header
      name: X-Server-Credential
      description: "Trusted game-server credential (prefix.secret). Never ship it in a client."
    publicEnvironment:
      type: apiKey
      in: header
      name: X-Public-Environment
      description: "Public environment identifier. Selects scope; it is not a secret."
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: "Identifies one logical operation; reuse it only when retrying that operation."
      schema:
        type: string
        minLength: 1
        maxLength: 200
  responses:
    E502:
      description: "The AI provider failed or could not be reached."
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    E503:
      description: "The AI assistant is not enabled on this deployment."
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    E400:
      description: "Malformed request or missing Idempotency-Key."
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    E401:
      description: "Missing or invalid authentication."
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    E403:
      description: "Not permitted."
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    E404:
      description: "Not found in the caller's scope."
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    E409:
      description: "Idempotency key reused with a different request, or conflicting state."
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    E422:
      description: "Business rule failed; validation errors carry details.errors."
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    E429:
      description: "Rate limited."
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
  schemas:
    BatchEntry:
      type: object
      properties:
        type:
          type: string
          enum:
            - grant
            - credit
            - xp
            - stat
            - flag
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 200
        player_id:
          type: string
          format: uuid
        item_key:
          type: string
          description: "grant"
        quantity:
          type: integer
          format: int64
          description: "grant"
        currency_key:
          type: string
          description: "credit"
        amount:
          type: integer
          format: int64
          description: "credit, xp, stat"
        stat_key:
          type: string
          description: "stat"
        flag_key:
          type: string
          description: "flag"
        reason:
          type: string
        reference:
          type: string
      required:
        - type
        - idempotency_key
        - player_id
    BatchRequest:
      type: object
      properties:
        entries:
          type: array
          items:
            "$ref": "#/components/schemas/BatchEntry"
      required:
        - entries
    BatchEntryResult:
      type: object
      properties:
        index:
          type: integer
        idempotency_key:
          type: string
        type:
          type: string
        status:
          type: integer
          description: "The HTTP status the same write would have returned on its own."
        data:
          type: object
          additionalProperties: true
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required:
            - code
            - message
      required:
        - index
        - idempotency_key
        - type
        - status
    BatchResult:
      type: object
      properties:
        results:
          type: array
          items:
            "$ref": "#/components/schemas/BatchEntryResult"
        applied:
          type: integer
        failed:
          type: integer
      required:
        - results
        - applied
        - failed
    AISettings:
      type: object
      properties:
        configured:
          type: boolean
        provider:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        key_last4:
          type: string
          nullable: true
          description: "The last four characters of the stored key; the key itself is never returned."
        base_url:
          type: string
          nullable: true
          description: "The endpoint of an openai_compatible provider; null for openai."
        updated_at:
          type: string
          format: date-time
          nullable: true
        providers:
          type: array
          items:
            type: string
      required:
        - configured
        - provider
        - model
        - key_last4
        - base_url
        - updated_at
        - providers
    AISettingsInput:
      type: object
      properties:
        provider:
          type: string
          enum:
            - openai
            - openai_compatible
          description: "openai uses the OpenAI Responses API; openai_compatible uses the Chat Completions API of any compatible service (OpenRouter, Together, Groq, vLLM, Ollama, ...) at base_url."
        model:
          type: string
