              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/SaveSummary"
                  meta:
                    "$ref": "#/components/schemas/Meta"
                required:
                  - data
                  - meta
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/SaveSummary"
                  meta:
                    "$ref": "#/components/schemas/Meta"
                required:
                  - data
                  - meta
        "400":
